# ─── quiz — Nginx reverse proxy config ───────────────────────────────────
#
# Prerequisites:
#   1. Certbot installed: sudo apt install certbot python3-certbot-nginx
#   2. Replace quiz.johnedeh.com with your actual domain throughout.
#   3. quiz NestJS backend is running on localhost:3002.
#
# After placing this file at /etc/nginx/sites-available/quiz:
#   sudo ln -s /etc/nginx/sites-available/quiz /etc/nginx/sites-enabled/
#   sudo nginx -t
#   sudo systemctl reload nginx
#   sudo certbot --nginx -d quiz.johnedeh.com
#

# Redirect bare HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name quiz.johnedeh.com;

    # Let Certbot manage the ACME challenge automatically
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — main server block
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name quiz.johnedeh.com;

    # ── SSL (populated by Certbot) ─────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/quiz.johnedeh.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.johnedeh.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options           DENY;
    add_header X-Content-Type-Options    nosniff;
    add_header Referrer-Policy           strict-origin-when-cross-origin;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    # ── Upload size (for question import CSV / sound upload) ───────────────────
    client_max_body_size 20M;

    # ── Proxy pass to NestJS ───────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:3002;
        proxy_http_version 1.1;

        # Required for WebSocket / Socket.IO upgrade
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Keep Socket.IO connections alive
        proxy_read_timeout  86400s;
        proxy_send_timeout  86400s;
        proxy_connect_timeout 10s;
    }
}
